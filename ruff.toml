# -------- Core options --------
line-length = 100
indent-width = 4
target-version = "py312"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # bugbear (bug-prone patterns)
    "SIM",    # simplify
    "S",      # bandit (security)
    "C4",     # comprehensions
    "ARG",    # unused function args
    "ANN",    # type annotations
    "D",      # docstrings
    "PL",     # pylint-like
    "TC",     # type-checking import placement
    "RET",    # return-value patterns
    "RUF100", # unused-noqa
    "FBT",    # boolean-trap
    "NPY",    # numpy-specific
]

ignore = [
    "PLR0913", # too many arguments
    "PLR0914", # too many locals
    "PLR1702", # too many branches
    "PLR2004", # magic numbers
    "PLR0915", # too many statements
    "S101",    # assert allowed in non-prod / tests
    "S404",    # subprocess warning (you already know what you're doing)
    "CPY001",  # copyright header
    "ERA001",  # commented-out code
    "PLR0904",
]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"tests/**" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ARG001",
    "RET504",
    "S101",
    "PLC0415", # `import` should be at the top-level of a file
]

"examples/**" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
]

# Example: allow more imperative / exploratory style in notebooks.
"notebooks/**" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
]

[lint.pydocstyle]
convention = "numpy"

[format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 120
